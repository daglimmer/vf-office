apiVersion: v1
kind: Namespace
metadata:
  name: vf-office
  labels:
    app: vf-office
    part-of: visual-office
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vf-office
  namespace: vf-office
  labels:
    app: vf-office
    part-of: visual-office
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vf-office
  template:
    metadata:
      labels:
        app: vf-office
        part-of: visual-office
    spec:
      containers:
        - name: vf-office
          image: registry.mission-control.svc.cluster.local:5000/vf-office:workflow
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      nodeSelector:
        kubernetes.io/hostname: k3s-srv-03
---
apiVersion: v1
kind: Service
metadata:
  name: vf-office
  namespace: vf-office
  labels:
    app: vf-office
    part-of: visual-office
spec:
  selector:
    app: vf-office
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vf-office
  namespace: vf-office
  labels:
    app: vf-office
    part-of: visual-office
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`vf.dev.110lymph.nl`)
      services:
        - name: vf-office
          port: 80
