name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  workflow-security:
    name: Workflow Security (zizmor + actionlint)
    runs-on: self-hosted
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2026-08-25: setup-python@v5 failed on EVERY run. This self-hosted runner has no
      # tool cache, so it tried to download 3.12 and fell over -- a permanent red X that
      # had nothing to do with the code. The box already has python3 (3.13). Use it.
      - name: Show Python
        run: python3 --version

      - name: Install zizmor + actionlint
        # 2026-08-25: plain `pip install` fails on this runner with
        # `externally-managed-environment` (PEP 668 - the system Python refuses to be
        # written to). Install into a throwaway venv and put it on PATH, so the run
        # steps below stay unchanged.
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install --quiet "zizmor==1.29.0" "actionlint-py==1.7.12.24"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Run zizmor on workflow files
        run: |
          zizmor --format plain --min-severity high --min-confidence high .github/workflows

      - name: Run actionlint on workflow files
        run: |
          actionlint .github/workflows/*.yml

      - name: Save zizmor JSON report
        if: always()
        run: |
          mkdir -p security-reports
          zizmor --format json .github/workflows > security-reports/zizmor.json || true

      - name: Upload zizmor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zizmor-report
          path: security-reports/zizmor.json
          retention-days: 30

  sast:
    name: SAST (Semgrep)
    runs-on: self-hosted
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2026-08-25: setup-python@v5 failed on EVERY run. This self-hosted runner has no
      # tool cache, so it tried to download 3.12 and fell over -- a permanent red X that
      # had nothing to do with the code. The box already has python3 (3.13). Use it.
      - name: Show Python
        run: python3 --version

      - name: Install Semgrep
        # 2026-08-25: plain `pip install` fails on this runner with
        # `externally-managed-environment` (PEP 668 - the system Python refuses to be
        # written to). Install into a throwaway venv and put it on PATH, so the run
        # steps below stay unchanged.
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/ci-venv/bin/pip" install --quiet "semgrep==1.174.0"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep custom + registry rules
        run: |
          semgrep scan             --config .semgrep.yml             --config p/security-audit             --config p/javascript             --config p/python             --config p/github-actions             --exclude .semgrep.yml             --severity ERROR             --error             --json --output semgrep-results.json             .

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  dependency-scan:
    name: Dependency Scan (osv-scanner)
    runs-on: self-hosted
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.5.1
        run: |
          mkdir -p "$RUNNER_TEMP/osv-scanner"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner/osv-scanner"             "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner/osv-scanner"
          echo "$RUNNER_TEMP/osv-scanner" >> "$GITHUB_PATH"

      - name: Run osv-scanner
        continue-on-error: true
        run: |
          mkdir -p security-reports
          osv-scanner scan source -r . --format json --output security-reports/osv-scanner.json || true
          osv-scanner scan source -r .

      - name: Upload osv-scanner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scanner-report
          path: security-reports/osv-scanner.json
          retention-days: 30
