name: Security Gate — kubeconfig path check

# Prevents regression of the /tmp/kubeconfig vulnerability (t_15f16d17).
# Runs on every push to any branch. Scans all workflow files for the
# insecure kubeconfig pattern (without RUNNER_TEMP) and fails if found.
# This is the only defense layer available without GitHub branch protection.
#
# NOTE: The scan pattern excludes THIS file from results to avoid
# self-matching on its own comments and echo statements.

on:
  push:
    paths:
      - '.github/workflows/**'

permissions: read-all

jobs:
  check-kubeconfig-path:
    name: Verify no insecure kubeconfig path in workflows
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Scan for insecure kubeconfig path
        run: |
          echo "Scanning workflows for insecure kubeconfig path..."
          # Match the literal insecure path, excluding lines that use RUNNER_TEMP
          # and excluding THIS gate file (which legitimately mentions it in comments)
          HITS=$(grep -rn 'kubeconfig' .github/workflows/ 2>/dev/null \
            | grep -v 'security-kubeconfig-gate.yml' \
            | grep -v 'RUNNER_TEMP' \
            | grep '/tmp/kubeconfig' \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Insecure kubeconfig path found (use \$RUNNER_TEMP/kubeconfig instead):"
            echo "$HITS"
            exit 1
          fi
          echo "PASS: All workflow files use secure pattern."
