name: Security Gate — kubeconfig path check

# Prevents regression of the /tmp/kubeconfig vulnerability.
# Scans all workflow files for the insecure /tmp/kubeconfig pattern
# (without RUNNER_TEMP) and fails if found.

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  check-kubeconfig-path:
    name: Verify no /tmp/kubeconfig in workflows
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Scan for insecure kubeconfig path
        run: |
          echo "Scanning .github/workflows/ for /tmp/kubeconfig..."
          HITS=$(grep -rn '/tmp/kubeconfig' .github/workflows/ --exclude='security-kubeconfig-gate.yml' 2>/dev/null | grep -v 'RUNNER_TEMP' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Insecure /tmp/kubeconfig pattern found (use \$RUNNER_TEMP/kubeconfig instead):"
            echo "$HITS"
            exit 1
          fi
          echo "PASS: All workflow files use secure RUNNER_TEMP pattern."
