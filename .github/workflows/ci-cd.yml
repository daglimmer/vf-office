name: VF Office CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: 10.75.1.211:30500
  IMAGE_NAME: vf-dashboard
  KUBECONFIG_PATH: /root/.kube/config

jobs:
  # ════════════════════════════════════════════════════════════════
  # QUALITY GATES — Must pass before deploy
  # ════════════════════════════════════════════════════════════════
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc.* ]; then
            npx eslint . --ext .js,.ts,.vue
          else
            echo "No ESLint config — skipping"
          fi

      - name: Typecheck (TypeScript)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No TypeScript config — skipping"
          fi

      - name: Build verification
        run: npm run build

      - name: Verify dist/index.html exists
        run: test -f dist/index.html && echo "✓ Build output verified"

      - name: PointLight regression guard
        run: |
          CURRENT=$(grep -c 'PointLight' public/3d.html 2>/dev/null || echo 0)
          HEAD_COUNT=$(git show HEAD:public/3d.html 2>/dev/null | grep -c 'PointLight' || echo 0)
          if [ "$CURRENT" -gt "$HEAD_COUNT" ]; then
            echo "❌ REGRESSION: New PointLights added ($HEAD_COUNT → $CURRENT)"
            exit 1
          fi
          echo "✓ PointLight count OK ($CURRENT)"

  # ════════════════════════════════════════════════════════════════
  # DOCKER BUILD & PUSH
  # ════════════════════════════════════════════════════════════════
  docker:
    name: Build & Push Docker
    needs: quality-gates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format '{{json .Manifest.Digest}}' 2>/dev/null || echo "")
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

  # ════════════════════════════════════════════════════════════════
  # DEPLOY TO K3s — STAGING FIRST
  # ════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs: docker
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Deploy to K3s staging namespace
        run: |
          export KUBECONFIG=${{ env.KUBECONFIG_PATH }}
          NS="mission-control-staging"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.digest }}"
          kubectl set image deploy/vf-dashboard -n "$NS" "vf-dashboard=$IMAGE" --record
          kubectl rollout status deploy/vf-dashboard -n "$NS" --timeout=120s

      - name: Staging health checks
        run: |
          sleep 5
          STAGING_URL="https://staging-vf.k3s.110lymph.nl"
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "$STAGING_URL/" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Staging health check failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✓ Staging health check: HTTP $HTTP_CODE"

      - name: Staging API verification
        run: |
          STAGING_API="https://staging-vf.k3s.110lymph.nl/api/backups"
          RESPONSE=$(curl -sk --max-time 10 "$STAGING_API" || echo '{}')
          echo "$RESPONSE" | jq -e '.vaults | length >= 3' || (echo "❌ API verification failed"; exit 1)
          echo "✓ Staging API verified: 3 vaults with backupJobs"

      - name: Staging screenshot evidence
        uses: addnab/docker-run-action@v3
        with:
          image: mcr.microsoft.com/playwright:v1.40.0-jammy
          run: |
            npx playwright install chromium 2>/dev/null
            npx -y playwright screenshot "${{ env.STAGING_URL }}/" /tmp/staging-home.png --full-page
            npx -y playwright screenshot "${{ env.STAGING_URL }}/backups" /tmp/staging-backups.png --full-page
          options: -v /tmp:/tmp
        env:
          STAGING_URL: https://staging-vf.k3s.110lymph.nl

      - name: Upload staging screenshots
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ github.sha }}
          path: /tmp/staging-*.png
          retention-days: 7

  # ════════════════════════════════════════════════════════════════
  # DEPLOY TO PRODUCTION — Manual approval gate
  # ════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Deploy to K3s production namespace
        run: |
          export KUBECONFIG=${{ env.KUBECONFIG_PATH }}
          NS="mission-control"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.digest }}"
          kubectl set image deploy/vf-dashboard -n "$NS" "vf-dashboard=$IMAGE" --record
          kubectl rollout status deploy/vf-dashboard -n "$NS" --timeout=120s

      - name: Production health checks
        run: |
          sleep 5
          PROD_URL="https://vf.k3s.110lymph.nl"
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "$PROD_URL/" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Production health check failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✓ Production health check: HTTP $HTTP_CODE"

      - name: Production API verification
        run: |
          PROD_API="https://olympus.110lymph.nl/api/backups"
          RESPONSE=$(curl -sk --max-time 10 "$PROD_API" || echo '{}')
          echo "$RESPONSE" | jq -e '.vaults | length >= 3' || (echo "❌ API verification failed"; exit 1)
          echo "$RESPONSE" | jq -e '.vaults[].backupJobs | length >= 0' || (echo "❌ backupJobs missing"; exit 1)
          echo "✓ Production API verified: 3 vaults with backupJobs + nextRun"

      - name: Production screenshot evidence
        uses: addnab/docker-run-action@v3
        with:
          image: mcr.microsoft.com/playwright:v1.40.0-jammy
          run: |
            npx playwright install chromium 2>/dev/null
            npx -y playwright screenshot "${{ env.PROD_URL }}/" /tmp/prod-home.png --full-page
            npx -y playwright screenshot "${{ env.PROD_URL }}/backups" /tmp/prod-backups.png --full-page
            npx -y playwright screenshot "${{ env.PROD_URL }}/dashboard" /tmp/prod-dashboard.png --full-page
          options: -v /tmp:/tmp
        env:
          PROD_URL: https://vf.k3s.110lymph.nl

      - name: Upload production screenshots
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ github.sha }}
          path: /tmp/prod-*.png
          retention-days: 30

      - name: Kanban task completion with evidence
        if: env.KANBAN_TASK_ID != ''
        run: |
          cat > /tmp/kanban-complete.md <<'EOF'
          ## Deployment Complete — ${{ github.sha }}

          **Evidence:**
          - Production health: ✓ HTTP 200
          - Production API: ✓ 3 vaults with backupJobs
          - Screenshots: [Home](/artifacts/production-evidence-), [Backups], [Dashboard]
          - Image digest: ${{ needs.docker.outputs.digest }}

          **Verification checklist:**
          ✓ Quality gates passed (lint, typecheck, build, PointLight guard)
          ✓ Staging deployed & verified
          ✓ Production deployed & verified
          ✓ Screenshots captured
          EOF
          # Post to Kanban via API or CLI
          # hermes kanban complete ${{ env.KANBAN_TASK_ID }} --summary "$(cat /tmp/kanban-complete.md)"
        env:
          KANBAN_TASK_ID: ${{ github.event.inputs.kanban_task_id }}

  # ════════════════════════════════════════════════════════════════
  # ROLLBACK ON FAILURE
  # ════════════════════════════════════════════════════════════════
  rollback:
    name: Rollback on Failure
    needs: [deploy-staging, deploy-production]
    if: failure()
    runs-on: self-hosted
    steps:
      - name: Rollback production to previous image
        run: |
          export KUBECONFIG=${{ env.KUBECONFIG_PATH }}
          NS="mission-control"
          # Get previous revision
          PREV_REV=$(kubectl rollout history deploy/vf-dashboard -n "$NS" --revision=0 -o jsonpath='{.revisions[-2].revision}')
          if [ -n "$PREV_REV" ]; then
            kubectl rollout undo deploy/vf-dashboard -n "$NS" --to-revision="$PREV_REV"
            kubectl rollout status deploy/vf-dashboard -n "$NS" --timeout=60s
            echo "✓ Rolled back to revision $PREV_REV"
          else
            echo "⚠ No previous revision to rollback to"
          fi

      - name: Alert on failure
        run: |
          echo "::warning::Deployment failed — rollback attempted. Check workflow logs."
          # Send to Telegram/Discord via webhook if configured