name: VF Office CI/CD

# Builds the office image (root Dockerfile = Vite frontend + adapter) and deploys
# to deploy/olympus-office (staging -> production -> health check -> rollback).
# Runs on push to master (the repo's working branch) or manual dispatch.
# REQUIRES: a self-hosted runner registered to this repo/org (LAN access to the
# registry + kubectl) and REGISTRY_USER/REGISTRY_TOKEN secrets.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: 10.75.1.211:30500
  IMAGE_NAME: vf-office
  KUBECONFIG_PATH: /root/.kube/config

jobs:
  # ════════════════════════════════════════════════════════════════
  # QUALITY GATES — Must pass before deploy
  # ════════════════════════════════════════════════════════════════
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc.* ]; then
            npx eslint . --ext .js,.ts,.vue
          else
            echo "No ESLint config — skipping"
          fi

      - name: Typecheck (TypeScript)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No TypeScript config — skipping"
          fi

      - name: Build verification
        run: npm run build

      - name: Verify dist/index.html exists
        run: test -f dist/index.html && echo "✓ Build output verified"

      - name: PointLight regression guard
        run: |
          CURRENT=$(grep -c 'PointLight' public/3d.html 2>/dev/null || echo 0)
          HEAD_COUNT=$(git show HEAD:public/3d.html 2>/dev/null | grep -c 'PointLight' || echo 0)
          if [ "$CURRENT" -gt "$HEAD_COUNT" ]; then
            echo "❌ REGRESSION: New PointLights added ($HEAD_COUNT → $CURRENT)"
            exit 1
          fi
          echo "✓ PointLight count OK ($CURRENT)"

  # ════════════════════════════════════════════════════════════════
  # DOCKER BUILD & PUSH — office image (root Dockerfile)
  # ════════════════════════════════════════════════════════════════
  docker:
    name: Build & Push Docker
    needs: quality-gates
    runs-on: self-hosted   # private registry (10.75.1.211) is only reachable on the LAN
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: tag
        run: echo "tag=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry (plain Docker — respects host daemon.json)
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login "${{ env.REGISTRY }}" \
              --username "${{ secrets.REGISTRY_USER }}" \
              --password-stdin

      - name: Build image (plain docker build — no Buildx isolation)
        run: |
          docker build \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            -f Dockerfile \
            .

      - name: Push image (plain docker push — uses host daemon's insecure-registries)
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  # ════════════════════════════════════════════════════════════════
  # DEPLOY TO K3s — STAGING FIRST (rollout status is the gate; the office
  # has no separate public staging URL configured here)
  # ════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs: docker
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Deploy to K3s staging namespace
        run: |
          export KUBECONFIG=${{ env.KUBECONFIG_PATH }}
          NS="mission-control-staging"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}"
          kubectl set image deploy/olympus-office -n "$NS" "olympus-office=$IMAGE" --record
          kubectl rollout status deploy/olympus-office -n "$NS" --timeout=120s
          echo "✓ Staging rollout complete"

  # ════════════════════════════════════════════════════════════════
  # DEPLOY TO PRODUCTION
  # ════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    needs: [docker, deploy-staging]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Deploy to K3s production namespace
        run: |
          export KUBECONFIG=${{ env.KUBECONFIG_PATH }}
          NS="mission-control"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image_tag }}"
          kubectl set image deploy/olympus-office -n "$NS" "olympus-office=$IMAGE" --record
          kubectl rollout status deploy/olympus-office -n "$NS" --timeout=120s

      - name: Production health check (office)
        run: |
          sleep 5
          OFFICE_URL="https://olympus.110lymph.nl/office/"
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "$OFFICE_URL" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Production health check failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✓ Production health check: HTTP $HTTP_CODE"

      - name: Production screenshot evidence
        continue-on-error: true   # evidence only — must never roll back a healthy deploy
        uses: addnab/docker-run-action@v3
        with:
          image: mcr.microsoft.com/playwright:v1.40.0-jammy
          run: |
            npx playwright install chromium 2>/dev/null
            npx -y playwright screenshot "https://olympus.110lymph.nl/office/" /tmp/prod-office.png --full-page
          options: -v /tmp:/tmp

      - name: Upload production screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ github.sha }}
          path: /tmp/prod-*.png
          retention-days: 30

  # ════════════════════════════════════════════════════════════════
  # ROLLBACK ON FAILURE
  # ════════════════════════════════════════════════════════════════
  rollback:
    name: Rollback on Failure
    needs: [deploy-staging, deploy-production]
    if: failure()
    runs-on: self-hosted
    steps:
      - name: Rollback production to previous image
        run: |
          export KUBECONFIG=${{ env.KUBECONFIG_PATH }}
          NS="mission-control"
          PREV_REV=$(kubectl rollout history deploy/olympus-office -n "$NS" --revision=0 -o jsonpath='{.revisions[-2].revision}')
          if [ -n "$PREV_REV" ]; then
            kubectl rollout undo deploy/olympus-office -n "$NS" --to-revision="$PREV_REV"
            kubectl rollout status deploy/olympus-office -n "$NS" --timeout=60s
            echo "✓ Rolled back to revision $PREV_REV"
          else
            echo "⚠ No previous revision to rollback to"
          fi

      - name: Alert on failure
        run: |
          echo "::warning::Deployment failed — rollback attempted. Check workflow logs."
