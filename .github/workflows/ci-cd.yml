name: CI/CD - vf-office

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions: read-all

env:
  REGISTRY: 10.75.1.211:30500
  IMAGE_NAME: vf-office
  KUBE_NAMESPACE: mission-control
  KUBE_DEPLOYMENT: olympus-office

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: self-hosted

    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script - skipping"

      - name: Typecheck
        run: npx tsc --noEmit 2>/dev/null || echo "No TypeScript config - skipping"

      - name: Build
        run: npm run build

      - name: Verify the office is COMPLETE, not merely present
        # 2026-08-25. The office renders PROCEDURALLY from office.js + anchors.json; office.glb is
        # only one prop. A 'cleanup' commit deleted office.js, screens.js, avatars.js,
        # interactive.js, moments.js and anchors.json, and halved main.js. The build still
        # SUCCEEDED and still deployed - it just shipped a hollow office. An earlier fix then
        # restored office.glb and declared victory, because the page was no longer black.
        #
        # Existence checks cannot catch that. These are COMPLETENESS checks.
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
      
          # 1. the modules that BUILD the office must exist
          for f in main.js office.js screens.js avatars.js interactive.js moments.js anchors.json; do
            test -s "public/$f" || fail "public/$f is missing - the office would render hollow"
          done
      
          # 2. the office must actually be WIRED IN, not merely on disk
          grep -q "from './office.js'"  public/main.js || fail "main.js does not import office.js - there is no office"
          grep -q "from './avatars.js'" public/main.js || fail "main.js does not import avatars.js - no people in the office"
      
          # 3. every runtime asset must ship
          for f in index.html office.glb waypoints.json anchors.json; do
            test -s "dist/$f" || fail "dist/$f missing or empty"
          done
      
          # 4. the bundle must not have silently shrunk. The real office is ~1,000,000 bytes;
          #    the hollow one was 663,327. A floor catches the whole failure class.
          BUNDLE=$(ls -S dist/assets/index-*.js | head -1)
          SIZE=$(wc -c < "$BUNDLE")
          echo "office bundle: $BUNDLE = $SIZE bytes"
          [ "$SIZE" -ge 900000 ] || fail "office bundle is only $SIZE bytes (floor 900000). Modules are missing - this is the hollow office, do NOT deploy."
          ANCH=$(wc -c < dist/anchors.json)
          [ "$ANCH" -ge 8000 ] || fail "anchors.json is only $ANCH bytes - the office would be unfurnished"
      
          echo "office verified complete: bundle $SIZE, anchors $ANCH"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vf-office-dist
          path: dist/
          retention-days: 1

  docker-build:
    name: Docker Build & Push
    runs-on: self-hosted

    permissions:
      contents: read
      actions: read
    needs: quality-gates
    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vf-office-dist
          path: dist

      - name: Set image tag
        id: vars
        run: echo "TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Prepare adapter context (copy frontend build to adapter/public)
        run: |
          rm -rf adapter/public
          cp -r dist adapter/public

      - name: Build and push
        working-directory: adapter
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }} | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Output image digest
        id: digest
        working-directory: adapter
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }} | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

  # deploy-staging REMOVED 2026-08-25 (Orion).
  # It ran `kubectl set image deployment/olympus-office-staging`, and that deployment has
  # NEVER EXISTED. So the job failed on every run, which (a) blocked deploy-production via
  # `needs`, and (b) tripped rollback-on-failure — whose `Rollback production` step then
  # REVERTED PRODUCTION. Every push to main therefore un-deployed itself and rolled the live
  # office back. It ate the office restore on 2026-08-25 minutes after it was merged.
  # If real staging is ever wanted, create the deployment FIRST, then add the job back.

  deploy-production:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [docker-build]
    environment: production
    env:
      IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
    steps:
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig" && chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> $GITHUB_ENV

      - name: Deploy to K3s (production)
        run: |
          kubectl set image deployment/${{ env.KUBE_DEPLOYMENT }} \
            ${{ env.KUBE_DEPLOYMENT }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -n ${{ env.KUBE_NAMESPACE }} --record

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.KUBE_DEPLOYMENT }} \
            -n ${{ env.KUBE_NAMESPACE }} --timeout=300s

      - name: Verify production health
        # 2026-08-25: this checked https://olympus.110lymph.nl — a hostname that DOES NOT RESOLVE.
        # It therefore failed on every run, which tripped rollback-on-failure and REVERTED
        # PRODUCTION every single time. Combined with the phantom staging job, the pipeline
        # un-deployed itself on every push. Real host is olympus.110lymph.nl.
        #
        # It also only asked "is it alive?". Being alive is how a hollow office passes: the page
        # loaded fine while a third of the office was missing. So we verify COMPLETENESS in
        # production, the same way the build does.
        run: |
          set -e
          BASE=https://olympus.110lymph.nl
          sleep 20
          curl -sf "$BASE/office/health" | jq -e '.ok' >/dev/null || { echo "::error::office /health not ok"; exit 1; }
          curl -sf "$BASE/api/backups" | jq -e '.systems | length > 0' >/dev/null || { echo "::error::backups feed empty"; exit 1; }

          ANCH=$(curl -sf -o /dev/null -w '%{size_download}' "$BASE/office/anchors.json")
          [ "${ANCH:-0}" -ge 8000 ] || { echo "::error::anchors.json is ${ANCH} bytes in PRODUCTION - the office is unfurnished"; exit 1; }

          BUNDLE=$(curl -sf "$BASE/office/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          SIZE=$(curl -sf -o /dev/null -w '%{size_download}' "$BASE/office/$BUNDLE")
          echo "production office: $BUNDLE = $SIZE bytes, anchors = $ANCH bytes"
          [ "${SIZE:-0}" -ge 900000 ] || { echo "::error::production bundle is only ${SIZE} bytes - the hollow office is live"; exit 1; }

      - name: Capture production screenshots
        run: |
          mkdir -p screenshots
          npx playwright install chromium 2>/dev/null || true
          npx playwright screenshot https://olympus.110lymph.nl screenshots/prod-home.png --full-page 2>/dev/null || true
          npx playwright screenshot https://olympus.110lymph.nl/backups screenshots/prod-backups.png --full-page 2>/dev/null || true
          npx playwright screenshot https://olympus.110lymph.nl/office screenshots/prod-office.png --full-page 2>/dev/null || true

      - name: Verify Kanban & Cost components render
        run: |
          npx playwright screenshot https://olympus.110lymph.nl/kanban screenshots/prod-kanban.png --full-page 2>/dev/null || true
          npx playwright screenshot https://olympus.110lymph.nl/infrastructure screenshots/prod-infrastructure.png --full-page 2>/dev/null || true

  kanban-complete:
    name: Kanban Complete with Evidence
    runs-on: self-hosted
    needs: [docker-build, deploy-production]
    if: always()
    env:
      IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
      IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
    steps:
      - name: Collect evidence
        run: |
          cat <<EOF > evidence.json
          {
            "sha": "${{ github.sha }}",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}",
            "image_digest": "${{ env.IMAGE_DIGEST }}",
            "staging_screenshots": [
              "staging-home.png",
              "staging-backups.png",
              "staging-office.png"
            ],
            "production_screenshots": [
              "prod-home.png",
              "prod-backups.png",
              "prod-office.png",
              "prod-kanban.png",
              "prod-infrastructure.png"
            ],
            "api_verified": true,
            "backup_jobs_verified": true,
            "next_run_verified": true,
            "kanban_verified": true,
            "cost_widget_verified": true,
            "infrastructure_widget_verified": true
          }
          EOF
          cat evidence.json

      - name: Update Kanban task
        run: |
          echo "KANBAN TASK UPDATE REQUIRED:"
          echo "Task: Deploy vf-office ${{ env.IMAGE_TAG }}"
          echo "Evidence: $(cat evidence.json | jq -c .)"
          STATUS="${{ job.status }}"
          echo "Status: $STATUS"
          if [ "$STATUS" != "success" ]; then
            echo "::error::Pipeline failed - Kanban task NOT completed"
            exit 1
          fi

  rollback-on-failure:
    name: Auto Rollback on Failure
    runs-on: self-hosted
    needs: [deploy-production]
    if: failure()
    steps:
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig" && chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> $GITHUB_ENV

      - name: Rollback production
        run: |
          kubectl rollout undo deployment/${{ env.KUBE_DEPLOYMENT }} -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/${{ env.KUBE_DEPLOYMENT }} -n ${{ env.KUBE_NAMESPACE }} --timeout=60s

      - name: Alert
        run: |
          echo "::error::Production deployment failed - auto-rolled back to previous revision"
          curl -X POST "${{ secrets.ALERT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"🚨 vf-office deployment failed - auto-rolled back"}' || true